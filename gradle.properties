org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Compile in-process instead of in the Kotlin daemon.
#
# The daemon writes a client marker under %LOCALAPPDATA%\kotlin\daemon. Sandboxes
# and locked-down CI images routinely deny that write, and the failure is loud and
# confusing: "Could not connect to Kotlin compile daemon" followed by Gradle
# silently falling back. The fallback works, but it costs a wasted daemon start on
# every build and buries real compiler errors under a stack trace.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
