name: Release

# Runs on a version tag, and can also be started by hand for a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# `contents: write` is what lets the release step attach an asset. Without it the job builds an
# APK and then fails at the last step with a 403.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `android-actions/setup-android` is deliberately NOT used here.
      #
      # It runs `sdkmanager tools` as part of its own setup, and Google removed the standalone
      # `tools` package. Newer cmdline-tools (16.0 on the current runner image) answer
      # "Warning: Failed to find package 'tools'" and exit 1, which the action treats as fatal —
      # the job dies in setup and never reaches the build. The runner image already ships the
      # SDK, so the action was only ever saving two lines.
      #
      # The path is resolved rather than assumed: cmdline-tools has lived under both `latest`
      # and a version number, and a hardcoded `latest` is a build that breaks on someone else's
      # runner image.
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | head -1)
          echo "sdkmanager: $CMDLINE"
          yes | "$CMDLINE" --licenses > /dev/null 2>&1 || true
          "$CMDLINE" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Keyed on the build scripts rather than on the source: a source change recompiles but
      # reuses every downloaded dependency, which is the part that actually costs minutes.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # The keystore itself is never committed. It arrives base64-encoded in a secret and is
      # decoded into the checkout, where `.gitignore` keeps it out of any commit.
      #
      # A missing secret is a warning rather than a failure: the build still produces an
      # unsigned APK, which is useful as an artifact even though it cannot be installed.
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOLOG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHOTOLOG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHOTOLOG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHOTOLOG_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::PHOTOLOG_KEYSTORE_BASE64 is unset — building an UNSIGNED apk that cannot be installed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > photolog-release-v1.jks
          {
            echo "storeFile=photolog-release-v1.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > photolog-keystore.properties

      # The ordering and naming contract of an export — including whether a Chinese caption
      # survives as a file name inside the ZIP — is a pure JVM test, so it runs here rather
      # than needing a device.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release
        run: ./gradlew :app:assembleRelease --console=plain

      # Fails loudly rather than publishing an unsigned artifact by accident: an unsigned APK in
      # a release is worse than no release, because it looks installable and is not.
      - name: Verify the APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk: $APK"
          if ! "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK"; then
            echo "::error::the release APK is not signed; refusing to publish it"
            exit 1
          fi
          cp "$APK" "photolog-${GITHUB_REF_NAME:-dev}.apk"
          ls -la photolog-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: photolog-*.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
